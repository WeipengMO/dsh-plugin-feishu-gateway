name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Markdown documentation links
        run: pnpm run docs:check

      - name: Proxy startup offline smoke (no real network)
        run: |
          bash -n scripts/channel/start-feishu-channel.sh
          bash -n tests/proxy-startup.smoke.sh
          bash tests/proxy-startup.smoke.sh

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: ESM runtime import smoke (catch CJS interop regressions)
        run: |
          node --input-type=module -e "await import('./lib/channel/lark-transport.js'); console.log('LarkTransport ESM import OK')"
          node --input-type=module -e "const { HttpsProxyAgent } = await import('https-proxy-agent'); const agent = new HttpsProxyAgent('http://127.0.0.1:9'); if (typeof agent?.addRequest !== 'function') throw Error('Invalid HTTPS proxy Agent'); console.log('Proxy agent v9 constructor OK')"
          node --input-type=module -e "await import('./lib/index.js'); console.log('Gateway entrypoint import OK')"

      - name: Unit + integration tests (mock transports only)
        run: pnpm run test
        env:
          # Guardrail: CI must never reach a real Feishu tenant.
          FEISHU_GATEWAY_OFFLINE: '1'

      - name: Check Web Admin source syntax
        run: |
          for file in web-admin/src/*.js; do node --check "$file"; done

      - name: Web admin security tests
        run: timeout --signal=INT --kill-after=5s 45s node --test --test-reporter=spec web-admin/test/*.test.mjs && node --check web-admin/lib/client.js

      - name: Coverage
        run: pnpm run test:coverage

      - name: Pack check
        run: pnpm run pack

      - name: Check published artifact privacy and file hygiene
        run: |
          node --test scripts/security/check-package-contents.test.mjs
          node scripts/security/check-package-contents.mjs

      - name: Verify both prerelease archives and generate SHA256 manifest
        run: pnpm run release:check

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-plugin-feishu-gateway-tarball
          path: |
            dist/*.tgz
            dist/release-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
