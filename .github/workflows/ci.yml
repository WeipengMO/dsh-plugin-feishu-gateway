name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit + integration tests (mock transports only)
        run: pnpm run test
        env:
          # Guardrail: CI must never reach a real Feishu tenant.
          FEISHU_GATEWAY_OFFLINE: '1'

      - name: Web admin security tests
        run: timeout --signal=INT --kill-after=5s 45s node --test --test-reporter=spec web-admin/test/*.test.mjs && node --check web-admin/lib/client.js

      - name: Coverage
        run: pnpm run test:coverage

      - name: Pack check
        run: pnpm run pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-feishu-gateway-tarball
          path: dist/*.tgz
          if-no-files-found: error
