name: One-time Vitest security remediation

on:
  push:
    branches: [security/ci-supply-chain-audit]
    paths:
      - .github/workflows/temporary-vitest-upgrade.yml

permissions:
  contents: write

jobs:
  update-dev-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.18.0
      - name: Update exact versions without executing dependency scripts
        run: pnpm add --save-dev --save-exact --ignore-scripts vitest@4.1.12 @vitest/coverage-v8@4.1.12
      - name: Commit only package manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Already up to date'
          else
            git commit -m 'fix(dev-deps): upgrade Vitest to patched v4 and drop vulnerable Tinypool'
            git push origin HEAD:security/ci-supply-chain-audit
          fi
