# One-time repair: both beta.2 packages already published successfully.
# The publish workflow failed only because npm read replicas had not indexed
# the new versions when it immediately queried them. Reuse the exact build
# artifacts from that successful upload; never re-publish npm in this job.
name: Attach beta.2 verified release archives

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-beta2-artifacts-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    if: github.repository == 'WeipengMO/dsh-plugin-feishu-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch original published npm tarballs from the successful build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-archives
          run-id: 44311627543
          github-token: ${{ github.token }}
          path: dist

      - name: Verify both original tarballs against the original SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          test -s dist/dsh-plugin-feishu-gateway-0.1.0-beta.2.tgz
          test -s dist/dsh-plugin-feishu-admin-0.1.0-beta.2.tgz

      - name: Confirm both version records have propagated to npm
        shell: bash
        run: |
          set -euo pipefail
          for name in dsh-plugin-feishu-gateway dsh-plugin-feishu-admin; do
            found=0
            for attempt in $(seq 1 30); do
              v="$(npm view "${name}@0.1.0-beta.2" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
              if [ "$v" = '0.1.0-beta.2' ]; then
                echo "${name}@${v} is available on npm"
                found=1
                break
              fi
              sleep 10
            done
            [ "$found" = 1 ] || { echo "::error::${name}@0.1.0-beta.2 is not yet visible on npm"; exit 1; }
          done

      - name: Attach checked archives to the existing GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.1.0-beta.2 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v0.1.0-beta.2 \
            dist/dsh-plugin-feishu-gateway-0.1.0-beta.2.tgz \
            dist/dsh-plugin-feishu-admin-0.1.0-beta.2.tgz \
            dist/SHA256SUMS dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view v0.1.0-beta.2 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
