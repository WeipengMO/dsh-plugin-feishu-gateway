name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

# Scanners never receive write access, npm tokens or Feishu credentials.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (history + working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fLSs --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/$archive"
          (cd "$RUNNER_TEMP" && echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/security-tools"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/security-tools" gitleaks
          "$RUNNER_TEMP/security-tools/gitleaks" version
      - name: Scan ALL reachable Git history (secrets fully redacted)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/security-tools/gitleaks" git --no-banner --redact=100 --verbose --log-opts="--all" .
      - name: Scan current checkout and uncommitted files
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/security-tools/gitleaks" dir --no-banner --redact=100 --verbose .

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.18.0
      - name: Reject high/critical production dependency vulnerabilities
        run: pnpm audit --prod --audit-level=high
      - name: Reject critical development dependency vulnerabilities
        run: pnpm audit --audit-level=critical

  malware-and-package:
    name: Malware and npm archive hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.18.0
      - name: Install dependencies without third-party install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify archive policy unit tests
        run: node --test scripts/security/check-package-contents.test.mjs
      - name: Build exactly what would be published
        run: |
          pnpm run build
          pnpm run pack
      - name: Reject private data and unexpected files inside npm tarballs
        run: node scripts/security/check-package-contents.mjs
      - name: Install and update ClamAV signatures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout
          clamscan --version
      - name: Scan release tarballs and extracted content
        shell: bash
        run: |
          set -euo pipefail
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          for archive in dist/*.tgz; do
            name="$(basename "$archive" .tgz)"
            mkdir -p "$extract_dir/$name"
            tar -xzf "$archive" -C "$extract_dir/$name"
          done
          clamscan --recursive --infected dist "$extract_dir"
