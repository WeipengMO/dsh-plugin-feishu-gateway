# One-time handoff for beta.2. GitHub's GITHUB_TOKEN does not trigger
# a release workflow when it creates a Release, so explicitly dispatch
# npm-publish.yml (workflow_dispatch is an allowed exception).
name: Bootstrap beta.2 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-beta2-bootstrap-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    if: github.repository == 'WeipengMO/dsh-plugin-feishu-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify expected release version and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          for (const file of ['package.json', 'web-admin/package.json']) {
            const { version } = JSON.parse(readFileSync(file, 'utf8'))
            if (version !== '0.1.0-beta.2') {
              console.error('Expected 0.1.0-beta.2 in ' + file + ', got ' + version)
              process.exit(1)
            }
          }
          NODE

      - name: Await successful CI and Security on this exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          get_result() {
            local workflow="$1"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/${workflow}.yml/runs?per_page=30" |
              jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0] | if . == null then "missing" else (.conclusion // .status) end'
          }
          for attempt in $(seq 1 120); do
            ci="$(get_result ci)"
            security="$(get_result security)"
            echo "Check $attempt: CI=$ci Security=$security"
            if [ "$ci" = success ] && [ "$security" = success ]; then
              echo 'Release gates passed'
              exit 0
            fi
            if [[ "$ci" == failure || "$ci" == cancelled || "$security" == failure || "$security" == cancelled ]]; then
              echo "::error::CI or Security failed on the release commit"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CI and Security"
          exit 1

      - name: Create v0.1.0-beta.2 GitHub prerelease and dispatch trusted npm workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release='v0.1.0-beta.2'
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The first attempt already created the release; retry only that exact tag.
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release" --jq '.object.sha')"
            test "$tag_sha" = '00eb3841a736cd7e566e5f57c1749f65d8d02596' || {
              echo "::error::Unexpected tag target for existing prerelease"
              exit 1
            }
            echo "Reusing previously created $release; dispatching fixed npm workflow"
          else
            gh release create "$release" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v0.1.0-beta.2 (npm beta)" \
              --prerelease \
              --notes "End-user npm installation guide and Trusted Publishing integration. See docs/PUBLISHING.md."
          fi
          # GITHUB_TOKEN-created release events do not automatically trigger another workflow.
          # Explicit workflow_dispatch is supported and preserves npm-publish.yml as the OIDC identity.
          gh workflow run npm-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$release" \
            -f prerelease=true
          echo "Release published and npm Trusted Publishing workflow dispatched."
