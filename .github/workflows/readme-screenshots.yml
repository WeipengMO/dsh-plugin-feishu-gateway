name: Chrome README screenshots
on:
  workflow_dispatch:
  push:
    branches: [docs/chrome-admin-preview]
    paths:
      - scripts/render-readme-screenshots.mjs
      - .github/workflows/readme-screenshots.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install fonts and verify Chrome
        run: |
          which google-chrome
          google-chrome --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Prepare React for the isolated preview
        run: |
          mkdir -p /tmp/feishu-preview-react
          npm install --prefix /tmp/feishu-preview-react --no-package-lock --no-save --ignore-scripts react@18.3.1 react-dom@18.3.1
      - name: Build actual Web Admin client
        run: node web-admin/scripts/build.mjs
      - name: Render screenshots with Chrome
        env:
          REACT_BASE: /tmp/feishu-preview-react
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node scripts/render-readme-screenshots.mjs
          file docs/screenshots/*.png
      - name: Save PNGs to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo 'No screenshot changes'
          else
            git commit -m 'docs: capture Chrome screenshots for README'
            # README/documentation commits may land while Chrome is capturing.
            # Rebase our generated PNG commit instead of losing the screenshots.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
